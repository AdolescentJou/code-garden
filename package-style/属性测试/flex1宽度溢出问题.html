<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .container {
        width: 300px;
        height: 200px;
        margin: auto;
        padding: 10px;
        border: 1px solid #ccc;
        display: flex;
      }

      /* flex子盒子会默认给上min-width:auto的属性，如果内容宽度为auto，子组件宽度超过盒子的话会aa撑开子盒子的宽度 */
      /* 解决办法 */
      /* 设置min-width：0可以解决当flex子元素的子元素大小为auto的情况；
        设置overflow不为visible可以解决所有情况下的麻烦； */

      .box {
        height: 100%;
        flex: 1;
        margin: auto;
      }

      span {
        width: 100%;
        overflow-wrap: break-word;
        font-size: 16px;
        background-color: orange;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <span>wefn neoi nrgn oirgn inoern bg bonboenbornboin eeevkjwnlnwvwnlwnbniboirbnwobnreiobnronrornbirnorbinornbr uuebgiubri rg rogn rogn rogin ro no</span>
      </div>
    </div>
  </body>
</html>
