<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
        font-family: 'PingFang SC Regular';
        src: url('../assets/fonts/PingFang\ SC\ Regular.ttf');
      }
      
      p {
        text-align: left;
        font-family: Robot, Arial, Helvetica, PingFangSC, Microsoft Yahei, sans serif;
      }

      .p1 {
        font-weight: 100;
      }
      .p2 {
        font-weight: 400;
        -webkit-text-stroke: 0.6px rgba(23, 39, 64, 0.75);
      }
      .p3 {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="p1">The sky reflects the earth, and the sky makes the sound of rain</p>
      <p class="p2">The sky reflects the earth, and the sky makes the sound of rain</p>
      <p class="p3">The sky reflects the earth, and the sky makes the sound of rain</p>
    </div>

    <div class="box">
      <p class="p1">映地为天色，飞空作雨声</p>
      <p class="p2">映地为天色，飞空作雨声</p>
      <p class="p3">映地为天色，飞空作雨声</p>
    </div>
  </body>
</html>
