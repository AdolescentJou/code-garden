<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 200px;
        height: 400px;
        margin: auto;
        margin-top: 40px;
        padding: 10px;
        border: 1px solid black;
        display: flex;
        overflow: hidden;
      }

      .box { 
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        justify-content: center;
        /* 在不设绝对宽度的情况下，会影响子组件交叉轴宽度 */
        align-items: center;  
        border: 1px solid transparent;
      }

      .content{
        width: 100%;
        flex-grow: 1;
        flex-shrink: 1;
        flex-basis: 1;
        /* height: 100%; */
        padding: 10px 0;
        border: 2px solid red;
        box-sizing: border-box;
        overflow: scroll;
      }

      .inner{
        width: 100%;
        height: 800px;
        background:linear-gradient(180deg ,white,blue );
      }

    </style>
  </head>
  <body>
    <div class="container"> 
      <div class="box">
        <div class="content">
          <div class="inner"></div>
          <div class="span"></div>
        </div>
      </div>
    </div>
  </body>
</html>
