<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .out {
        width: 400px;
        height: 400px;
        margin: 30px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        animation: load 3s ease 0s infinite;
      }

      @keyframes load {
        from {
          transform: rotate(-360deg);
        }

        25% {
          transform: rotate(-270deg);
        }

        50% {
          transform: rotate(-180deg);
        }

        75% {
          transform: rotate(-90deg);
        }

        to {
          transform: rotate(0deg);
        }
      }

      .inner {
        width: 396px;
        height: 396px;
        border-radius: 50%;
        background-color: white;
        z-index: 10;
      }

      .mask {
        width: 20px;
        height: 402px;
        background-color: #58a;
        position: absolute;
        top: 0;
        left: 190px;
        transform-origin: 50% 50%;
        z-index: 9;
        animation: expend 3s ease 0s infinite;
      }

      @keyframes expend {
        from {
          width: 0;
        }

        25% {
          transform: scaleX(5);
        }

        50% {
          transform: scaleX(10);
        }

        75% {
          transform: scaleX(15);
        }

        to {
          transform: scaleX(20);
        }
      }
    </style>
  </head>
  <body>
    <div class="out">
      <div class="mask"></div>
      <div class="inner"></div>
    </div>
  </body>
</html>
